name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS arm64 runners get CPU-only torch wheels; Linux would pull CUDA wheels.
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
