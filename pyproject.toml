[project]
name = "smallquant"
version = "0.0.1"
description = "PyTorch-native derivatives pricing with exact Greeks from autograd"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.15"
dependencies = ["torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smallquant"]

[dependency-groups]
test = [
    "numpy>=2.2.6",
    "pytest",
    "QuantLib",
    "ruff>=0.17",
    "tensorflow>=2.21.0",
    "tf-keras>=2.21.0",
    "tf-quant-finance>=0.0.1.dev34",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "quantlib: compares against QuantLib reference values",
    "tfquant: compares against TF Quant Finance reference values",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Pyflakes, syntax-level pycodestyle and import order. Formatting is not enforced yet.
select = ["E4", "E7", "E9", "F", "I"]
