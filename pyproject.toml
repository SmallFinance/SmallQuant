[project]
name = "smallquant"
version = "0.0.1"
description = "PyTorch-native derivatives pricing with exact Greeks from autograd"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = ["torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smallquant"]

[dependency-groups]
test = [
    "numpy>=2.2.6",
    "pytest",
    "QuantLib",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["quantlib: compares against QuantLib reference values"]
